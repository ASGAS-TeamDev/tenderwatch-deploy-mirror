# Tender Watch — Apache vhost for watch.titan-ai.co.za
#
# Serves the static Vite SPA at / and reverse-proxies /api/* to the
# FastAPI backend (uvicorn) running on loopback 127.0.0.1:8001.
# TLS is issued by Let's Encrypt via `certbot --apache` (see install.sh);
# certbot rewrites this file in place to add the :443 ssl stanza and the
# HTTP→HTTPS redirect. Do NOT run certbot before this file is enabled
# as a :80 vhost — certbot needs a live :80 vhost to satisfy ACME
# HTTP-01.

<VirtualHost *:80>
    ServerName watch.titan-ai.co.za

    DocumentRoot /var/www/watch.titan-ai.co.za

    # /api/* → uvicorn on loopback. Trailing slash on the ProxyPass target
    # is intentional: it makes Apache forward /api/health as /api/health
    # (no path rewrite). proxy_http required (enabled in install.sh).
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /api/ http://127.0.0.1:8001/api/

    # SPA fallback: any path that isn't a real file serves index.html so
    # client-side routing works. mod_rewrite required (enabled in install.sh).
    <Directory /var/www/watch.titan-ai.co.za>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        FallbackResource /index.html
    </Directory>

    # Cache static assets aggressively (Vite emits content-hashed filenames).
    <FilesMatch "\.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|woff)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/watch_titan-ai_error.log
    CustomLog ${APACHE_LOG_DIR}/watch_titan-ai_access.log combined
</VirtualHost>
