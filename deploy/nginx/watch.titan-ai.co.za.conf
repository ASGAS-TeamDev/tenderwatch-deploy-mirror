# Tender Watch — nginx vhost for watch.titan-ai.co.za
#
# Serves the static Vite SPA at / and reverse-proxies /api/* to the
# FastAPI backend (uvicorn) running on loopback 127.0.0.1:8001.
# TLS is issued by Let's Encrypt via `certbot --nginx` (see install.sh);
# certbot rewrites this file in place to add the :443 ssl stanza and the
# HTTP→HTTPS redirect. Do NOT run certbot before this file is enabled
# as a :80 server block — certbot needs a live :80 server block to
# satisfy ACME HTTP-01.

server {
    listen 80;
    listen [::]:80;
    server_name watch.titan-ai.co.za;

    root /var/www/watch.titan-ai.co.za;
    index index.html;

    # /api/* → uvicorn on loopback. Trailing slash on the proxy_pass
    # target is intentional: nginx forwards /api/health unchanged when
    # both location and proxy_pass end in /. Avoids silent path rewrites.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # uvicorn defaults to no timeout for streaming; keep a sane cap.
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # Cache static assets aggressively (Vite emits content-hashed filenames).
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any path that isn't a real file serves index.html so
    # client-side routing works. This must come after /api/ and the
    # asset-cache location, but before the default location.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/watch_titan-ai_access.log;
    error_log  /var/log/nginx/watch_titan-ai_error.log;
}